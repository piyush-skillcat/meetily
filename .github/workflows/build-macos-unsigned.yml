name: "Build macOS (unsigned)"

# Ad-hoc signed Apple Silicon build that needs no repository secrets.
# Runs on pushes to build/macos, or by hand from the Actions tab.
on:
  push:
    branches: [build/macos]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # llama.cpp's bundled cpp-httplib does not compile against the runner's
  # Homebrew OpenSSL, and linking it would tie the app to Homebrew anyway.
  # The sidecar only runs local models, so build it without HTTPS.
  CMAKE_DISABLE_FIND_PACKAGE_OpenSSL: "ON"
  # Matches bundle.macOS.minimumSystemVersion (tauri.macos.conf.json): the
  # system audio tap needs macOS 14.4, so compile C/C++ deps for it too.
  MACOSX_DEPLOYMENT_TARGET: "14.4"

jobs:
  build:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: macos-unsigned-aarch64

      - name: Install build tools
        # meson + ninja build WebRTC's echo canceller from source (bundled feature)
        run: brew install meson ninja

      - name: Install frontend dependencies
        working-directory: frontend
        # The lockfile lags package.json "overrides", so it cannot be frozen
        run: pnpm install --no-frozen-lockfile

      - name: Build llama-helper sidecar (Metal)
        run: |
          cargo build --release -p llama-helper --features metal
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-aarch64-apple-darwin

      - name: Build app and DMG
        working-directory: frontend
        # tauri.macos.conf.json sets the bundle ID, minimum macOS and turns
        # off updater archives. signingIdentity "-" ad-hoc signs the bundle.
        run: pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Check the bundle
        run: |
          APP=$(find target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          PLIST="$APP/Contents/Info.plist"
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          echo "Minimum macOS: $(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$PLIST")"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Every executable may link only system libraries (no Homebrew dylibs)
          status=0
          for bin in "$APP"/Contents/MacOS/*; do
            echo "== $(basename "$bin") (minos $(otool -l "$bin" | awk '/minos/ {print $2; exit}'))"
            others=$(otool -L "$bin" | tail -n +2 | awk '{print $1}' | grep -vE '^(/System/|/usr/lib/|@rpath/|@executable_path/|@loader_path/)' || true)
            if [ -n "$others" ]; then
              echo "::error::$(basename "$bin") links non-system libraries: $others"
              status=1
            fi
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: always() # keep the DMG even when the bundle check flags something
        with:
          name: notesify-macos-aarch64-${{ github.sha }}
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14
